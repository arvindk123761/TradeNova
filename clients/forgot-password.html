<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNova | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="brand">
                <span class="logo-mark" aria-hidden="true">TN</span>
                <h1>TradeNova</h1>
                <p>India's Smart Trading Platform</p>
            </div>
            <div class="features">
                <div class="feature">✔ Secure password recovery</div>
                <div class="feature">✔ Reset link expires after 15 minutes</div>
            </div>
        </div>
        <div class="right-section">
            <main class="login-card">
                <h2>Forgot password?</h2>
                <p>Enter the email address linked to your account. If it exists, we’ll send a password reset link.</p>
                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required>
                    </div>
                    <button type="submit" class="login-btn" id="sendResetButton">Send Reset Link</button>
                </form>
                <div class="register-link">
                    <a href="login.html">Back to Login</a>
                </div>
            </main>
        </div>
    </div>
    <script src="js/toast.js"></script>
    <script src="js/forgotPassword.js"></script>
</body>
</html>
