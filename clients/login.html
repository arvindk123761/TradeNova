<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TradeNova | Login</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="css/login.css">

<link rel="stylesheet"
href="css/toast.css">

</head>

<body>

<div class="login-container">

<!-- ===========================
LEFT SIDE
=========================== -->

<div class="left-section">

<div class="brand">

<h1>

TradeNova

</h1>

<p>

India's Smart Trading Platform

</p>

</div>

<div class="illustration">

<img
src="images/login.svg"
alt="Login">

</div>

<div class="features">

<div class="feature">

✔ Zero Brokerage on Delivery

</div>

<div class="feature">

✔ Live Market Data

</div>

<div class="feature">

✔ Secure & Fast Trading

</div>

<div class="feature">

✔ IPO | Mutual Funds | ETFs

</div>

</div>

</div>

<!-- ===========================
RIGHT SIDE
=========================== -->

<div class="right-section">

<div class="login-card">

<h2>

Welcome Back 👋

</h2>

<p>

Login to continue your investment journey.

</p>

<form id="loginForm">

<div class="input-group">

<label>

Email Address

</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="input-group">

<label>

Password

</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="login-options">

<label>

<input
type="checkbox"
id="rememberMe">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

<div class="register-link">

Don't have an account?

<a href="register.html">

Create Account

</a>

</div>

</form>

</div>

</div>

</div>

<!-- ===========================
LOADING
=========================== -->

<div
class="loading-screen"
id="loadingScreen">

<div class="loader"></div>

<p>

Signing You In...

</p>

</div>

<script src="js/toast.js"></script>

<script src="js/login.js"></script>

</body>

</html>
