<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeNova | Set New Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <div class="login-container">
        <div class="left-section">
            <div class="brand">
                <span class="logo-mark" aria-hidden="true">TN</span>
                <h1>TradeNova</h1>
                <p>India's Smart Trading Platform</p>
            </div>
            <div class="features">
                <div class="feature">✔ Choose a new password</div>
                <div class="feature">✔ Use at least 6 characters</div>
            </div>
        </div>
        <div class="right-section">
            <main class="login-card">
                <h2>Set a new password</h2>
                <p>Choose a new password for your TradeNova account.</p>
                <form id="resetPasswordForm">
                    <div class="input-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" maxlength="72" required>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="6" maxlength="72" required>
                    </div>
                    <button type="submit" class="login-btn" id="resetPasswordButton">Update Password</button>
                </form>
                <div class="register-link">
                    <a href="login.html">Back to Login</a>
                </div>
            </main>
        </div>
    </div>
    <script src="js/toast.js"></script>
    <script src="js/resetPassword.js"></script>
</body>
</html>
