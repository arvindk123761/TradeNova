<div class="topbar">

    <div class="top-left">

        <div class="search-box">

            🔍

            <input
                type="text"
                id="searchBox"
                placeholder="Search companies or symbols"
                autocomplete="off"
                role="combobox"
                aria-autocomplete="list"
                aria-controls="stockSearchResults"
                aria-expanded="false">

        </div>
        <div class="stock-search-results" id="stockSearchResults" role="listbox" hidden></div>

    </div>

    <div class="top-center">

        <button class="market-box" type="button" data-market-index="nifty">

            <small>NIFTY</small>

            <strong class="green">

                +0.82%

            </strong>

        </button>

        <button class="market-box" type="button" data-market-index="sensex">

            <small>SENSEX</small>

            <strong class="green">

                +0.55%

            </strong>

        </button>

        <button class="market-box" type="button" data-market-index="banknifty">

            <small>BANK NIFTY</small>

            <strong class="red">

                -0.24%

            </strong>

        </button>

    </div>

    <div class="top-right">

        <div class="wallet">

            💰

            <span id="topWallet">

                ₹0

            </span>

        </div>

        <section class="market-detail-modal" id="marketDetailModal" role="dialog" aria-modal="true" aria-labelledby="marketDetailTitle" hidden>
            <div class="market-detail-panel">
                <button class="market-detail-close" type="button" aria-label="Close market details">&times;</button>
                <p class="market-detail-eyebrow">MARKET INDEX</p>
                <h2 id="marketDetailTitle"></h2>
                <p class="market-detail-description" id="marketDetailDescription"></p>
                <div class="market-detail-chart">
                    <div class="market-detail-chart-heading">
                        <strong id="marketDetailValue"></strong>
                        <span>Illustrative intraday trend</span>
                    </div>
                    <svg id="marketDetailChart" viewBox="0 0 640 190" role="img" aria-label="Illustrative index trend chart"></svg>
                    <div class="market-detail-chart-labels"><span>9:15 AM</span><span>12:00 PM</span><span>3:30 PM</span></div>
                </div>
                <div class="market-detail-companies">
                    <h3>Example constituent companies</h3>
                    <p>Index membership can change. These are examples, not a complete current constituents list.</p>
                    <div id="marketDetailCompanyList"></div>
                </div>
                <p class="market-detail-disclaimer">Sample prices and chart only; TradeNova is not connected to a live exchange index feed.</p>
            </div>
        </section>

        <div class="profile">

            <span class="topbar-avatar" id="topUserAvatar" aria-hidden="true">U</span>

            <span id="topUser">Account</span>

        </div>

    </div>

</div>
